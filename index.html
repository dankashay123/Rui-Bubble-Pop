<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rui's Reef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#021028">
<title>Rui's Reef</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Bubblegum+Sans&display=swap" rel="stylesheet">
<style>
:root{
  --abyss:#010a1c; --deep:#052b4d; --mid:#0a5878; --shallow:#118a9c; --surface:#3fd4d0;
  --sun:#ffeeb0; --coral:#ff6b8a; --gold:#ffd54a; --pearl:#f2f9ff;
  --ink:#eaffff;
  --disp:'Bubblegum Sans','Baloo 2','Trebuchet MS',system-ui,-apple-system,sans-serif;
  --hud:'Baloo 2','Trebuchet MS',system-ui,-apple-system,sans-serif;
  --r:26px;
}
*,*::before,*::after{
  box-sizing:border-box;margin:0;padding:0;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:none;
}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;top:0;left:0;
  background:var(--abyss);-webkit-font-smoothing:antialiased;}

/* ══ WORLD (persistent across every screen) ══ */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,var(--surface) 0%,var(--shallow) 12%,
    var(--mid) 32%,var(--deep) 62%,var(--abyss) 92%);}
#surface-band{position:fixed;top:0;left:0;right:0;height:16vh;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0));
  mix-blend-mode:screen;opacity:.5;animation:breathe 7s ease-in-out infinite alternate;}
@keyframes breathe{from{opacity:.3;transform:translateY(-4px)}to{opacity:.58;transform:translateY(4px)}}
#water{position:fixed;inset:0;z-index:2;pointer-events:none;}
#echo{position:fixed;inset:0;z-index:3;opacity:0;mix-blend-mode:screen;pointer-events:none;}
@keyframes echoPulse{from{opacity:.4}to{opacity:0}}
.kelp{position:fixed;bottom:-2vh;z-index:4;transform-origin:50% 100%;pointer-events:none;}
.kelp.front{z-index:30;filter:blur(2px);opacity:.42;}
@keyframes sway{0%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}100%{transform:rotate(-3.5deg)}}
#stage{position:fixed;inset:0;z-index:10;pointer-events:none;}
/* Free-play bursts belong in #stage, behind the kelp and creatures. Rewards on the
   quiz/count screens must clear those screens (z-70), so they go here instead. */
#fx{position:fixed;inset:0;z-index:245;pointer-events:none;}
#flash{position:fixed;inset:0;z-index:190;opacity:0;pointer-events:none;}
@keyframes flashOut{0%{opacity:0}10%{opacity:1}100%{opacity:0}}

@media (prefers-reduced-motion:reduce){
  #surface-band,.kelp,#jbell{animation:none!important;}
  .bubble .film{animation:none!important;}
}

/* ══ SCREENS ══ */
.screen{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;
  align-items:center;pointer-events:none;
  opacity:1;transition:opacity .3s ease,transform .3s ease;}
.screen>*{pointer-events:auto;}
.screen.off{opacity:0;transform:scale(.94);pointer-events:none;}
.screen.off>*{pointer-events:none;}
.wrap{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 14px);}

/* ══ HUB ══ */
#hub .wrap{justify-content:center;gap:18px;}
#hub-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);
  right:16px;z-index:5;}
.hub-title{font-family:var(--disp);text-align:center;line-height:1;margin-bottom:2px;}
.hub-title .t1{display:block;font-size:clamp(38px,11vw,58px);color:#fff;
  text-shadow:0 0 26px rgba(120,235,255,.9),0 0 60px rgba(60,190,230,.5);}
.hub-title .t2{display:block;font-family:var(--hud);font-weight:600;
  font-size:clamp(12px,3.3vw,15px);letter-spacing:.22em;text-transform:uppercase;
  color:rgba(200,240,255,.62);margin-top:8px;}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.tile{position:relative;border-radius:var(--r);padding:16px 12px 14px;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  border:1.5px solid rgba(255,255,255,.24);overflow:hidden;
  background:linear-gradient(160deg,rgba(14,74,104,.72),rgba(7,44,70,.78));
  box-shadow:0 8px 30px rgba(0,20,40,.42),inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .16s cubic-bezier(.34,1.56,.64,1);}
.tile::after{content:'';position:absolute;top:-38%;left:-14%;width:76%;height:62%;
  border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.34),transparent 70%);
  transform:rotate(-18deg);pointer-events:none;}
.tile:active{transform:scale(.94);}
.tile .ic{font-size:clamp(38px,11vw,50px);line-height:1;height:1em;
  display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.32));}
.tile .ic-svg{width:1.16em;height:1.16em;display:block;overflow:visible;}
.tile .nm{font-family:var(--disp);font-size:clamp(17px,4.8vw,23px);color:#fff;line-height:1;
  text-shadow:0 2px 8px rgba(0,0,0,.4);}
.tile .sb{font-family:var(--hud);font-weight:600;font-size:clamp(10px,2.8vw,12px);
  color:rgba(230,250,255,.66);line-height:1;text-align:center;}
.pills{display:flex;gap:6px;margin-top:2px;flex-wrap:wrap;justify-content:center;}
.pill{font-family:var(--hud);font-weight:700;font-size:11px;line-height:1;
  padding:5px 10px;border-radius:99px;color:rgba(225,248,255,.75);
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);}
.pill.on{background:rgba(255,255,255,.9);color:#08405c;border-color:#fff;}

/* ══ TOP BAR (games) ══ */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex:none;}
.back{width:46px;height:46px;flex:none;border-radius:50%;border:1.5px solid rgba(255,255,255,.26);
  background:rgba(9,58,84,.8);
  color:#fff;font-family:var(--hud);font-weight:800;font-size:22px;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.26);}
.back:active{transform:scale(.9);}
.mute{width:42px;height:42px;flex:none;border-radius:50%;cursor:pointer;
  border:1.5px solid rgba(255,255,255,.22);background:rgba(9,58,84,.72);
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22);}
.mute:active{transform:scale(.9);}
.mute svg{width:21px;height:21px;display:block;}
.mute .wave{transition:opacity .18s ease;}
.mute .slash{opacity:0;transition:opacity .18s ease;}
.mute.off .wave{opacity:0;}
.mute.off .slash{opacity:1;}
.mute.off{background:rgba(9,58,84,.45);border-color:rgba(255,255,255,.14);}
.dots{display:flex;gap:6px;flex:1;justify-content:center;}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.2);
  transition:background .3s,box-shadow .3s;}
.dot.on{background:var(--gold);box-shadow:0 0 12px var(--gold);}
.tally{display:flex;align-items:center;gap:7px;flex:none;
  padding:7px 15px 7px 11px;border-radius:99px;white-space:nowrap;
  background:rgba(9,58,84,.78);border:1.5px solid rgba(190,245,255,.26);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.26);}
.tally .lb{font-family:var(--hud);font-weight:600;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:rgba(214,248,255,.75);line-height:1;}
.tally .nb{font-family:var(--hud);font-weight:800;font-size:22px;color:#fff;line-height:1;
  min-width:1.3ch;display:inline-block;
  text-shadow:0 0 16px rgba(120,235,255,.8);}
.nb.pop{animation:nbPop .38s cubic-bezier(.34,1.56,.64,1);}
@keyframes nbPop{0%{transform:scale(1)}34%{transform:scale(1.5) rotate(-7deg)}100%{transform:scale(1)}}

/* ══ QUESTION ══ */
.ask{text-align:center;flex:none;margin-bottom:14px;}
.ask .eye{font-family:var(--hud);font-weight:700;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(200,240,255,.55);display:block;margin-bottom:6px;}
.ask .l1{font-family:var(--disp);font-size:clamp(19px,5.4vw,26px);color:rgba(240,253,255,.9);
  display:block;line-height:1.1;}
.ask .l2{font-family:var(--disp);font-size:clamp(33px,9.6vw,48px);display:block;line-height:1.12;}

/* ══ ORB GRID ══ */
.orbs{flex:1;display:flex;flex-wrap:wrap;align-content:center;align-items:center;
  justify-content:center;gap:14px;min-height:0;}
.orb{position:relative;flex:none;width:calc(50% - 7px);aspect-ratio:1;max-height:38vh;
  border-radius:50%;overflow:hidden;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.4);}
.orbs.n3 .orb,.orbs.n5 .orb{width:calc(33.333% - 10px);max-height:26vh;}
.orb.in{animation:orbIn .42s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes orbIn{to{opacity:1;transform:scale(1)}}
.orb .gloss{position:absolute;top:8%;left:12%;width:42%;height:30%;border-radius:50%;
  transform:rotate(-30deg);pointer-events:none;
  background:radial-gradient(ellipse,rgba(255,255,255,.9),transparent 70%);}
.orb .gloss2{position:absolute;top:17%;left:62%;width:13%;height:10%;border-radius:50%;
  pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.95),transparent 70%);}
.orb .em{font-size:min(17vw,74px);line-height:1;pointer-events:none;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.3));}
.orbs.n3 .orb .em,.orbs.n5 .orb .em{font-size:min(12vw,52px);}
.orb .sh{width:66%;height:66%;pointer-events:none;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.32));}
.orb.yes{opacity:1;animation:orbYes .5s ease forwards;}
@keyframes orbYes{
  0%{transform:scale(1)}35%{transform:scale(1.2)}
  100%{transform:scale(1.1);box-shadow:0 0 0 6px #fff,0 0 44px 12px rgba(255,255,255,.7)}}
.orb.no{opacity:1;transform:scale(1);animation:orbNo .42s ease;}
@keyframes orbNo{0%,100%{transform:translateX(0)}
  18%{transform:translateX(-11px) rotate(-4deg)}38%{transform:translateX(9px) rotate(3deg)}
  60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}

/* ══ COUNT ══ */
.cnum{text-align:center;flex:none;margin-bottom:12px;
  font-family:var(--disp);line-height:1;}
.cnum .now{font-size:clamp(52px,15vw,78px);color:#fff;
  text-shadow:0 0 26px rgba(120,235,255,.9);display:inline-block;min-width:1.4ch;}
.cnum .of{font-size:clamp(22px,6vw,32px);color:rgba(200,240,255,.5);}
.cnum .tot{font-size:clamp(30px,8vw,42px);color:var(--gold);
  text-shadow:0 0 20px rgba(255,213,74,.7);}
.now.pop{animation:nbPop .34s cubic-bezier(.34,1.56,.64,1);}
.now.done{color:var(--gold);text-shadow:0 0 34px var(--gold);}
.cgrid{flex:1;display:flex;flex-wrap:wrap;align-content:center;align-items:center;
  justify-content:center;gap:12px;min-height:0;}
.cbub{position:relative;flex:none;border-radius:50%;cursor:pointer;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.4);}
.cbub.in{animation:orbIn .4s cubic-bezier(.34,1.56,.64,1) forwards;}
.cbub .sh{width:62%;height:62%;pointer-events:none;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.3));}
.sh svg,.face svg,#cel-obj svg{display:block;width:100%;height:100%;}
.cbub .gloss{position:absolute;top:9%;left:13%;width:40%;height:29%;border-radius:50%;
  transform:rotate(-30deg);pointer-events:none;
  background:radial-gradient(ellipse,rgba(255,255,255,.88),transparent 70%);}
.cbub.gone{animation:cbubGone .3s ease-out forwards;pointer-events:none;}
@keyframes cbubGone{
  0%{transform:scale(1);opacity:1;filter:brightness(1)}
  35%{transform:scale(1.35);opacity:.8;filter:brightness(2)}
  100%{transform:scale(.1);opacity:0}}

/* ══ FREE PLAY HUD ══ */
#playhud{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;
  justify-content:center;gap:9px;align-items:flex-start;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;pointer-events:none;}
#playhud>*{pointer-events:auto;}
#gauge{display:flex;align-items:center;gap:9px;padding:8px 20px 8px 13px;border-radius:99px;
  white-space:nowrap;background:rgba(9,58,84,.78);border:1.5px solid rgba(190,245,255,.28);
  box-shadow:0 6px 26px rgba(0,20,40,.4),inset 0 1px 0 rgba(255,255,255,.28);}
#gauge svg{display:block;flex:none;}
#hud-label{font-family:var(--hud);font-weight:600;font-size:clamp(11px,3vw,15px);
  color:rgba(214,248,255,.82);letter-spacing:.05em;text-transform:uppercase;line-height:1;}
#hud-count{font-family:var(--hud);font-weight:800;font-size:clamp(22px,6vw,33px);color:#fff;
  line-height:1;min-width:1.5ch;display:inline-block;
  text-shadow:0 0 18px rgba(120,235,255,.85),0 0 40px rgba(60,190,230,.5);}
#hud-count.bump{animation:nbPop .38s cubic-bezier(.34,1.56,.64,1);}

/* ══ BUBBLES (free play) ══ */
.bubble{position:absolute;top:0;left:0;border-radius:50%;pointer-events:all;cursor:pointer;
  will-change:transform,opacity;backface-visibility:hidden;}
.bubble .film{position:absolute;inset:0;border-radius:50%;mix-blend-mode:screen;opacity:.85;
  background:conic-gradient(from var(--spin,0deg),
    rgba(255,120,190,.42),rgba(255,225,120,.34),rgba(120,255,215,.42),
    rgba(130,190,255,.38),rgba(215,130,255,.4),rgba(255,120,190,.42));}
.bubble .shineA{position:absolute;top:9%;left:13%;width:40%;height:29%;border-radius:50%;
  transform:rotate(-32deg);background:radial-gradient(ellipse,rgba(255,255,255,.95),transparent 70%);}
.bubble .shineB{position:absolute;top:17%;left:60%;width:13%;height:10%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.98),transparent 70%);}
.bubble .rim{position:absolute;inset:0;border-radius:50%;
  box-shadow:inset 0 -6px 14px rgba(255,255,255,.3),inset 0 4px 10px rgba(255,255,255,.14);}
.bubble .face{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);line-height:1;}
.bubble.popping{animation:burstOut .19s ease-out forwards;}
@keyframes burstOut{
  0%{transform:var(--tf) scale(1);opacity:1;filter:brightness(1)}
  35%{transform:var(--tf) scale(1.45);opacity:.85;filter:brightness(2.1)}
  100%{transform:var(--tf) scale(.05);opacity:0;filter:brightness(2.6)}}
.bubble.pearl .rim{box-shadow:inset 0 -10px 24px rgba(255,255,255,.45),
  inset 0 6px 16px rgba(255,255,255,.22),0 0 46px rgba(255,245,220,.5);}
.bubble.mystery{animation:mystGlow 1.5s ease-in-out infinite;}
@keyframes mystGlow{0%,100%{filter:drop-shadow(0 0 12px rgba(255,150,255,.7))}
  50%{filter:drop-shadow(0 0 34px rgba(255,150,255,1))}}
.bubble .qmark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:var(--disp);color:#fff;line-height:1;
  text-shadow:0 0 14px #ff7ae6,0 0 34px #ff4ad2;}

/* ══ WORDS / PARTICLES ══ */
.word{position:absolute;top:0;left:0;font-family:var(--disp);white-space:nowrap;
  line-height:1;z-index:22;will-change:transform,opacity;letter-spacing:.02em;}
@keyframes wordIn{
  0%{opacity:0;transform:var(--tf) scale(0) rotate(var(--tilt))}
  52%{opacity:1;transform:var(--tf) scale(1.22) rotate(var(--tilt))}
  76%{transform:var(--tf) scale(.93) rotate(var(--tilt))}
  100%{opacity:1;transform:var(--tf) scale(1) rotate(var(--tilt))}}
@keyframes wordOut{0%{opacity:1;transform:var(--tf) scale(1) rotate(var(--tilt))}
  100%{opacity:0;transform:var(--tf) translateY(-46px) scale(.82) rotate(var(--tilt))}}
.crown{position:absolute;left:50%;top:-.92em;font-size:1.1em;transform:translateX(-50%);
  animation:crownIn .45s cubic-bezier(.34,1.56,.64,1) forwards;
  filter:drop-shadow(0 0 10px rgba(255,215,0,.9));}
@keyframes crownIn{from{opacity:0;transform:translateX(-50%) translateY(14px) scale(0)}
  to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
.pcl{position:absolute;top:0;left:0;line-height:1;z-index:36;
  text-shadow:0 2px 5px rgba(0,0,0,.35);}
@keyframes pclOut{
  0%{opacity:1;transform:translate3d(var(--x0),var(--y0),0) scale(.35) rotate(0)}
  28%{opacity:1;transform:translate3d(var(--x1),var(--y1),0) scale(1.18) rotate(var(--r1))}
  64%{opacity:.9;transform:translate3d(var(--x1),calc(var(--y1) - 26px),0) scale(1) rotate(var(--r2))}
  100%{opacity:0;transform:translate3d(var(--x1),calc(var(--y1) - 54px),0) scale(.35) rotate(var(--r3))}}
.trail{position:fixed;border-radius:50%;z-index:8;pointer-events:none;}
@keyframes trailOut{from{opacity:.85;transform:scale(1)}to{opacity:0;transform:scale(.1)}}
.combo{position:fixed;top:0;left:0;z-index:220;font-family:var(--disp);line-height:1;
  white-space:nowrap;will-change:transform,opacity;pointer-events:none;}
@keyframes comboOut{
  0%{opacity:0;transform:var(--tf) scale(0) rotate(-10deg)}
  26%{opacity:1;transform:var(--tf) scale(1.3) rotate(4deg)}
  58%{transform:var(--tf) scale(.92) rotate(-2deg)}
  100%{opacity:0;transform:var(--tf) translateY(-40px) scale(1.05)}}

/* ══ CREATURES / SWIMMERS ══ */
.creature{position:fixed;line-height:1;z-index:52;pointer-events:all;cursor:pointer;
  filter:drop-shadow(0 10px 26px rgba(0,0,0,.36));will-change:transform;}
@keyframes peekUp{0%{transform:translateY(105%) scale(.7)}16%{transform:translateY(6%) scale(1.08)}
  24%{transform:translateY(14%) scale(1)}76%{transform:translateY(14%) scale(1)}
  100%{transform:translateY(108%) scale(.8)}}
@keyframes peekL{0%{transform:translateX(-105%) scale(.7)}16%{transform:translateX(-4%) scale(1.08)}
  24%{transform:translateX(-11%) scale(1)}76%{transform:translateX(-11%) scale(1)}
  100%{transform:translateX(-108%) scale(.8)}}
@keyframes peekR{0%{transform:translateX(105%) scaleX(-1) scale(.7)}
  16%{transform:translateX(4%) scaleX(-1) scale(1.08)}24%{transform:translateX(11%) scaleX(-1) scale(1)}
  76%{transform:translateX(11%) scaleX(-1) scale(1)}100%{transform:translateX(108%) scaleX(-1) scale(.8)}}
.swimmer{position:fixed;top:0;left:0;line-height:1;pointer-events:all;cursor:pointer;will-change:transform;}
.swimmer svg,.creature svg{display:block;width:100%;height:100%;}
.creature{line-height:0;}
#jelly{position:fixed;top:0;left:0;z-index:40;pointer-events:all;cursor:pointer;
  will-change:transform,opacity;filter:drop-shadow(0 0 26px rgba(150,240,255,.75));}
@keyframes jellyIn{from{opacity:0}to{opacity:1}}
@keyframes jellyFlee{from{opacity:1;transform:var(--tf) scale(1)}to{opacity:0;transform:var(--tf) scale(2.4)}}
@keyframes bell{0%,100%{transform:scaleY(1) scaleX(1)}45%{transform:scaleY(.82) scaleX(1.12)}}
.weed{position:fixed;top:0;left:0;z-index:5;pointer-events:all;cursor:pointer;
  will-change:transform;filter:drop-shadow(0 4px 14px rgba(0,40,40,.4));}
.weed-bit{position:fixed;border-radius:50%;z-index:6;will-change:transform,opacity;
  filter:blur(3px);pointer-events:none;}
@keyframes weedBurst{0%{transform:translate3d(0,0,0) scale(.4);opacity:.9}
  100%{transform:translate3d(var(--bx),var(--by),0) scale(1.7);opacity:0}}
.ruiname{position:fixed;top:0;left:0;z-index:26;font-family:var(--disp);
  font-size:clamp(32px,10vw,64px);letter-spacing:.16em;white-space:nowrap;
  will-change:opacity;pointer-events:none;}
.ruiname span{display:inline-block;opacity:0;}
@keyframes ruiIn{0%{opacity:0;transform:scale(0) rotate(-22deg) translateY(22px)}
  56%{opacity:1;transform:scale(1.24) rotate(5deg) translateY(-5px)}
  100%{opacity:1;transform:scale(1) rotate(0) translateY(0)}}
@keyframes ruiBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes ruiOut{from{opacity:1}to{opacity:0}}

/* ══ MILESTONE ══ */
.ms-label{position:fixed;left:50%;top:42%;z-index:212;font-family:var(--disp);
  font-size:clamp(58px,19vw,112px);color:#fff;text-align:center;line-height:1.06;
  will-change:transform,opacity;pointer-events:none;}
@keyframes msPop{0%{opacity:0;transform:translate(-50%,-50%) scale(0)}
  24%{opacity:1;transform:translate(-50%,-50%) scale(1.28)}
  54%{transform:translate(-50%,-50%) scale(.94)}76%{transform:translate(-50%,-50%) scale(1.05)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.ray{position:fixed;left:50%;top:50%;z-index:195;transform-origin:0 50%;border-radius:99px;
  will-change:transform,opacity;pointer-events:none;}
@keyframes rayOut{0%{opacity:.85;transform:rotate(var(--ra)) scaleX(0)}
  42%{opacity:.6;transform:rotate(var(--ra)) scaleX(1)}
  100%{opacity:0;transform:rotate(var(--ra)) scaleX(1.25)}}
.conf{position:fixed;z-index:250;pointer-events:none;}
@keyframes confFall{0%{opacity:1;transform:translate3d(0,var(--cy0),0) rotate(0) scale(1)}
  82%{opacity:1}100%{opacity:0;transform:translate3d(var(--cdx),var(--cy1),0) rotate(var(--cspin)) scale(.55)}}

/* ══ CELEBRATION ══ */
#cel{position:fixed;inset:0;z-index:240;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  opacity:0;pointer-events:none;transition:opacity .28s ease;}
#cel.on{opacity:1;pointer-events:auto;}
.cel-in{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:20px;}
#cel-obj{width:clamp(96px,30vw,164px);height:clamp(96px,30vw,164px);
  margin:0 auto;font-size:clamp(88px,26vw,140px);line-height:1;
  filter:drop-shadow(0 12px 30px rgba(0,0,0,.45));
  animation:celObj .7s cubic-bezier(.34,1.56,.64,1);}
@keyframes celObj{0%{transform:scale(0) rotate(-30deg)}60%{transform:scale(1.25) rotate(8deg)}
  100%{transform:scale(1) rotate(0)}}
#cel-praise{font-family:var(--disp);font-size:clamp(34px,10vw,52px);color:#fff;line-height:1;
  text-shadow:0 0 30px rgba(120,235,255,.9),0 3px 12px rgba(0,0,0,.5);
  animation:celUp .5s .1s backwards cubic-bezier(.34,1.4,.64,1);}
#cel-extra{font-family:var(--disp);font-size:clamp(20px,5.6vw,28px);line-height:1;
  animation:celUp .5s .2s backwards cubic-bezier(.34,1.4,.64,1);}
#cel-hint{font-family:var(--hud);font-weight:600;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(220,248,255,.5);margin-top:6px;
  animation:celUp .5s .35s backwards ease;}
@keyframes celUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

/* ══ LEVEL TOAST ══ */
#toast{position:fixed;left:50%;top:38%;z-index:230;transform:translate(-50%,-50%) scale(.6);
  opacity:0;pointer-events:none;text-align:center;
  padding:20px 30px;border-radius:30px;
  background:linear-gradient(160deg,rgba(16,78,110,.9),rgba(8,46,72,.93));
  border:1.5px solid rgba(255,255,255,.3);
  box-shadow:0 12px 44px rgba(0,20,40,.5),inset 0 1px 0 rgba(255,255,255,.3);}
#toast.on{animation:toastIn 1.7s cubic-bezier(.34,1.4,.64,1) forwards;}
@keyframes toastIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  14%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
  24%{transform:translate(-50%,-50%) scale(1)}
  82%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}}
#toast .ti{font-size:44px;line-height:1;}
#toast .tt{font-family:var(--disp);font-size:27px;color:var(--gold);line-height:1;margin-top:6px;
  text-shadow:0 0 22px rgba(255,213,74,.75);}
#toast .ts{font-family:var(--hud);font-weight:600;font-size:13px;
  color:rgba(225,248,255,.75);margin-top:5px;}

@media (prefers-reduced-motion:reduce){
  #surface-band,.kelp,.bubble.mystery{animation:none!important}
}
</style>

<script>
(function(){
'use strict';

/* ═══════════ SHARED ═══════════ */
let W=innerWidth, H=innerHeight;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const shuffle=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[r[i],r[j]]=[r[j],r[i]];}return r;};
const $=id=>document.getElementById(id);

let SCREEN='hub';
const stage=$('stage'), fxLayer=$('fx'), echoEl=$('echo');

/* ═══════════ ART — hand-drawn SVG icon set ═══════════
   One visual language for the whole reef: chunky rounded silhouettes, a
   light-to-saturated radial body fill, one soft highlight, no hairlines.
   Every icon draws in a 100x100 box from a single base colour, and every icon
   also has to read as a flat white silhouette on a coloured orb — so internal
   detail goes through D(), which is a shade of the body when tinted and a
   translucent ink when flat. */
const ART=(function(){
  let uid=0;
  const nid=()=>'a'+(uid++).toString(36);
  function hsl(hex,dl,ds){
    const n=parseInt(hex.slice(1),16), r=(n>>16)/255, g=((n>>8)&255)/255, b=(n&255)/255;
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let h=0,s=0,l=(mx+mn)/2;
    if(mx!==mn){const d=mx-mn; s=l>.5?d/(2-mx-mn):d/(mx+mn);
      h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4); h/=6;}
    const L=Math.max(0,Math.min(100,l*100+(dl||0))), S=Math.max(0,Math.min(100,s*100+(ds||0)));
    return 'hsl('+Math.round(h*360)+' '+Math.round(S)+'% '+Math.round(L)+'%)';
  }
  function grad(id,base){
    return '<radialGradient id="'+id+'" cx="34%" cy="26%" r="78%">'
      +'<stop offset="0%" stop-color="'+hsl(base,20,-6)+'"/>'
      +'<stop offset="55%" stop-color="'+base+'"/>'
      +'<stop offset="100%" stop-color="'+hsl(base,-14,4)+'"/></radialGradient>';
  }
  const shine=(cx,cy,rx,ry,o)=>'<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="#fff" opacity="'+(o||.5)+'" transform="rotate(-28 '+cx+' '+cy+')"/>';
  const eye=(cx,cy,r)=>'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#fff"/>'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*.56)+'" fill="#123043"/>'
    +'<circle cx="'+(cx-r*.24)+'" cy="'+(cy-r*.28)+'" r="'+(r*.2)+'" fill="#fff"/>';

  // f = body fill, D(depth) = internal detail, sh() = highlight (dropped when flat)
  const S={
    fish:(f,D,sh)=>'<path d="M30 50C30 34 45 26 60 28c12 2 22 10 27 22-5 12-15 20-27 22-15 2-30-6-30-22Z" fill="'+f+'"/>'
      +'<path d="M31 50 11 33c-3-3-7 0-6 4l3 13-3 13c-1 4 3 7 6 4l20-17Z" fill="'+f+'"/>'
      +'<path d="M52 29c4-9 13-12 18-8-3 5-3 9-1 13Z" fill="'+f+'"/>'
      +'<path d="M52 71c4 9 13 12 18 8-3-5-3-9-1-13Z" fill="'+f+'"/>'
      +'<path d="M46 52c-2 9 5 14 12 11" stroke="'+D(1)+'" stroke-width="5" fill="none" stroke-linecap="round"/>'
      +sh(48,38,13,6,.4)+eye(72,44,6),
    whale:(f,D,sh)=>'<path d="M74 40 97 21c3-2 6 2 4 5L84 52l17 26c2 3-1 7-4 5L74 64Z" fill="'+f+'"/>'
      +'<path d="M4 54C4 32 22 20 44 20c18 0 30 8 35 22 2 5 2 19 0 24-5 14-17 22-35 22C22 88 4 76 4 54Z" fill="'+f+'"/>'
      +'<path d="M6 65c10 14 26 21 40 21 14 0 25-5 32-14-14 9-52 14-72-7Z" fill="'+D(1)+'" opacity=".5"/>'
      +'<path d="M5 62c11 8 26 11 39 8" stroke="'+D(3)+'" stroke-width="4.5" fill="none" stroke-linecap="round"/>'
      +'<path d="M31 22c-4-9-3-16 3-21 3-2 7 1 5 5-3 6-3 10-1 15Z" fill="'+f+'"/>'
      +'<g fill="'+f+'"><circle cx="45" cy="9" r="3.4"/><circle cx="20" cy="10" r="2.8"/><circle cx="40" cy="2" r="2.4"/></g>'
      +sh(28,34,14,7,.4)+eye(22,50,6.5),
    turtle:(f,D,sh)=>'<ellipse cx="88" cy="50" rx="11" ry="10" fill="'+f+'"/>'
      +'<circle cx="92" cy="47" r="2.6" fill="#123043"/>'
      +'<g fill="'+f+'"><ellipse cx="26" cy="26" rx="11" ry="8" transform="rotate(-36 26 26)"/>'
      +'<ellipse cx="26" cy="74" rx="11" ry="8" transform="rotate(36 26 74)"/>'
      +'<ellipse cx="68" cy="24" rx="10" ry="7" transform="rotate(-24 68 24)"/>'
      +'<ellipse cx="68" cy="76" rx="10" ry="7" transform="rotate(24 68 76)"/></g>'
      +'<ellipse cx="48" cy="50" rx="34" ry="27" fill="'+f+'"/>'
      +'<g fill="'+D(2)+'" opacity=".8"><circle cx="48" cy="50" r="10"/>'
      +'<ellipse cx="26" cy="50" rx="7" ry="9"/><ellipse cx="70" cy="50" rx="7" ry="9"/>'
      +'<ellipse cx="48" cy="30" rx="9" ry="6"/><ellipse cx="48" cy="70" rx="9" ry="6"/></g>'
      +sh(34,34,13,6,.42),
    crab:(f,D,sh)=>'<g stroke="'+f+'" stroke-width="7" stroke-linecap="round">'
      +'<path d="M26 68 12 80M24 58 8 62M74 68 88 80M76 58 92 62"/></g>'
      +'<path d="M30 46C22 28 12 24 6 30c-6 7 2 17 14 22l4-2-6-6 12 2Z" fill="'+f+'"/>'
      +'<path d="M70 46c8-18 18-22 24-16 6 7-2 17-14 22l-4-2 6-6-12 2Z" fill="'+f+'"/>'
      +'<ellipse cx="50" cy="58" rx="30" ry="22" fill="'+f+'"/>'
      +'<path d="M36 66c8 6 20 6 28 0" stroke="'+D(2)+'" stroke-width="4.5" fill="none" stroke-linecap="round"/>'
      +sh(36,46,12,6,.4)+eye(40,50,6)+eye(60,50,6),
    octopus:(f,D,sh)=>'<g stroke="'+f+'" stroke-width="12" fill="none" stroke-linecap="round">'
      +'<path d="M22 60c-4 12-10 16-14 24M37 66c-3 12-6 18-6 26M63 66c3 12 6 18 6 26M78 60c4 12 10 16 14 24"/></g>'
      +'<path d="M18 56c0-20 14-34 32-34s32 14 32 34c0 8-6 12-14 12H32c-8 0-14-4-14-12Z" fill="'+f+'"/>'
      +sh(36,36,14,7,.42)+eye(38,46,7)+eye(62,46,7),
    jelly:(f,D,sh)=>'<g stroke="'+f+'" stroke-width="5.5" fill="none" stroke-linecap="round">'
      +'<path d="M28 58c-4 12 4 18-2 30M42 62c-3 14 3 20-2 32M58 62c3 14-3 20 2 32M72 58c4 12-4 18 2 30"/></g>'

/* ═══════════ ENGINE ═══════════ */
const ENT=new Set();
const holds=new Map();
const add=e=>{ENT.add(e);startLoop();return e;};
function kill(e){e.dead=true;ENT.delete(e);if(e.el&&e.el.parentNode)e.el.parentNode.removeChild(e.el);}
let prevT=performance.now();
let running=true, lastPaint=0, rafId=null;
// The water is all slow drift — repainting it 60x/s is wasted heat. 30 looks identical.
const PAINT_MS=33;
// With nothing moving there is nothing to animate at 60Hz either, so idle at ~30.
const IDLE_MS=32;

function frame(now){
  rafId=null;
  if(!running) return;
  const dt=Math.min((now-prevT)/1000,.05); prevT=now;

  ENT.forEach(e=>{
    if(e.dead){ENT.delete(e);return;}
    if(e.el&&!e.el.parentNode){ENT.delete(e);return;}
    e.update(dt,now);
  });

  if(now-lastPaint>=PAINT_MS){ lastPaint=now; paintWater(now); }

  // Nothing is moving: drop the whole loop to ~30Hz instead of spinning at 60.
  if(ENT.size===0 && !holds.size){
    setTimeout(()=>{ if(running&&!rafId) rafId=requestAnimationFrame(frame); },IDLE_MS);
  } else {
    rafId=requestAnimationFrame(frame);
  }
}
function startLoop(){
  if(!running||rafId) return;
  prevT=performance.now();
  rafId=requestAnimationFrame(frame);
}
startLoop();

// Screen off / app backgrounded / another tab: stop everything and free the audio hardware.
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    running=false;
    if(rafId){cancelAnimationFrame(rafId);rafId=null;}
    if(AC&&AC.state==='running')AC.suspend().catch(()=>{});
  }else{
    running=true; prevT=performance.now(); lastPaint=0;
    startLoop();
    if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});
  }
});
// iOS fires resize continuously while the URL bar slides; rebuilding the whole
// water sim on every one of those makes the rays and motes visibly jump.
let rzT=null;
addEventListener('resize',()=>{
  clearTimeout(rzT);
  rzT=setTimeout(()=>{
    const dw=Math.abs(innerWidth-W), dh=Math.abs(innerHeight-H);
    if(!dw&&!dh)return;
    W=innerWidth; H=innerHeight;
    // Small height-only changes (URL bar) just need the canvas resized, not new rays.
    sizeWater(dw>0||dh>140);
  },180);
});

const VOL=.9;
let MUTED=false;
try{ MUTED=localStorage.getItem('reef-mute')==='1'; }catch(e){}
function setMuted(v){
  MUTED=!!v;
  try{ localStorage.setItem('reef-mute',MUTED?'1':'0'); }catch(e){}
  // The pad and every one-shot run through master, so one gain silences the reef
  // without tearing down the audio graph — unmuting is instant.
  if(master){
    const t=AC.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setTargetAtTime(MUTED?0:VOL,t,.03);
  }
  document.querySelectorAll('.mute').forEach(b=>b.classList.toggle('off',MUTED));
}
let AC=null,master=null,muffle=null;
function ac(){
  if(!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=MUTED?0:VOL;
    muffle=AC.createBiquadFilter(); muffle.type='lowpass';
    muffle.frequency.value=5200; muffle.Q.value=.5;
    muffle.connect(master); master.connect(AC.destination);
  }
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function tone(o){
  if(MUTED)return;
  try{
    const c=ac(),n=c.currentTime;
    const osc=c.createOscillator(),g=c.createGain();
    osc.type=o.type||'sine'; osc.connect(g);
    if(o.pan!==undefined&&c.createStereoPanner){
      const p=c.createStereoPanner(); p.pan.value=Math.max(-1,Math.min(1,o.pan));
      g.connect(p); p.connect(muffle);
    } else g.connect(muffle);
    osc.frequency.setValueAtTime(o.f0,n);
    if(o.f1)osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.f1),n+o.dur);
    g.gain.setValueAtTime(0,n);
    g.gain.linearRampToValueAtTime(o.vol||.2,n+.012);
    g.gain.exponentialRampToValueAtTime(.0008,n+o.dur);
    osc.start(n); osc.stop(n+o.dur+.03);
  }catch(e){}
}
function arp(f,step,vol){
  if(MUTED)return;
  try{
    const c=ac(),n=c.currentTime;
    f.forEach((fr,i)=>{
      const o=c.createOscillator(),g=c.createGain();
      o.type='triangle'; o.frequency.value=fr; o.connect(g); g.connect(muffle);
      g.gain.setValueAtTime(0,n+i*step);
      g.gain.linearRampToValueAtTime(vol,n+i*step+.02);
      g.gain.exponentialRampToValueAtTime(.0008,n+i*step+.36);
      o.start(n+i*step); o.stop(n+i*step+.4);
    });
  }catch(e){}
}
const chord=(f,d,v)=>f.forEach((fr,i)=>tone({type:'sine',f0:fr*(1+i*.0012),dur:d,vol:v}));
function sPop(x,size){
  const b=700-Math.min(size,200)*1.9;
  tone({type:'sine',f0:b+rand(-40,40),f1:b*.32,dur:.15,vol:.3,pan:(x/W)*2-1});
  tone({type:'triangle',f0:b*1.9,f1:b*.6,dur:.08,vol:.09,pan:(x/W)*2-1});
}
const sBlub=()=>tone({type:'sine',f0:rand(200,300),f1:rand(420,560),dur:.11,vol:.07});
const sWord=()=>{const f=pick([523,587,659,784,880,988,1175]);tone({type:'triangle',f0:f,f1:f*1.5,dur:.26,vol:.15});};
const sYes=()=>arp([523,659,784,1047],.085,.19);
const sNo =()=>{tone({type:'sine',f0:300,f1:180,dur:.22,vol:.16});};
const sTick=()=>tone({type:'triangle',f0:rand(680,900),f1:rand(900,1200),dur:.1,vol:.13});

let padOn=false;
function startPad(){
  if(padOn||MUTED)return; padOn=true;
  try{
    const c=ac(); const g=c.createGain(); g.gain.value=.033; g.connect(muffle);
    [55,82.4,110,164.8].forEach((f,i)=>{
      const o=c.createOscillator(),og=c.createGain();
      o.type='sine'; o.frequency.value=f*(1+i*.0009); og.gain.value=.34/(i+1);
      o.connect(og); og.connect(g); o.start();
    });
    const lfo=c.createOscillator(),lg=c.createGain();
    lfo.frequency.value=.045; lg.gain.value=1400;
    lfo.connect(lg); lg.connect(muffle.frequency); lfo.start();
    (function plink(){
      if(Math.random()<.7){
        const o=c.createOscillator(),og=c.createGain();
        o.type='sine'; o.frequency.value=pick([523,587,659,784,880]);
        o.connect(og); og.connect(g);
        const n=c.currentTime;
        og.gain.setValueAtTime(0,n); og.gain.linearRampToValueAtTime(1.5,n+.05);
        og.gain.exponentialRampToValueAtTime(.001,n+1.5);
        o.start(n); o.stop(n+1.6);
      }
      setTimeout(plink,rand(3800,8500));
    })();
  }catch(e){}
}

/* ═══════════ WATER CANVAS ═══════════ */
const wc=$('water'), wx=wc.getContext('2d');
let RAYS=[],MOTES=[],rayGrad=null,floorCv=null;
const WSCALE=.7;
function buildFloor(){
  floorCv=document.createElement('canvas');
  floorCv.width=Math.round(W*WSCALE); floorCv.height=Math.round(H*WSCALE);
  const c=floorCv.getContext('2d'); c.setTransform(WSCALE,0,0,WSCALE,0,0);
  const fy=H*.885, g=c.createLinearGradient(0,fy-30,0,H);
  g.addColorStop(0,'rgba(90,120,120,0)');
  g.addColorStop(.4,'rgba(122,142,124,.26)');
  g.addColorStop(1,'rgba(198,180,134,.44)');
  c.fillStyle=g; c.beginPath(); c.moveTo(0,fy+Math.sin(1.2)*16);
  for(let x=0;x<=W;x+=18)c.lineTo(x,fy+Math.sin(x*.0062+1.2)*16+Math.sin(x*.0175)*7);
  c.lineTo(W,H); c.lineTo(0,H); c.closePath(); c.fill();
}
function sizeWater(regen){
  if(regen===undefined)regen=true;
  wc.width=Math.round(W*WSCALE); wc.height=Math.round(H*WSCALE);
  wc.style.width=W+'px'; wc.style.height=H+'px';
  wx.setTransform(WSCALE,0,0,WSCALE,0,0);
  buildFloor();
  rayGrad=wx.createLinearGradient(0,0,0,H*.95);
  rayGrad.addColorStop(0,'rgba(255,250,215,.3)');
  rayGrad.addColorStop(.35,'rgba(210,245,255,.14)');
  rayGrad.addColorStop(1,'rgba(190,240,255,0)');
  if(!regen&&RAYS.length&&MOTES.length)return;
  RAYS=Array.from({length:6},(_,i)=>({x:(i/6)*W+rand(-40,40),w:rand(28,86),
    spread:rand(1.5,3.2),tilt:rand(-.16,.16),speed:rand(.05,.14),
    phase:Math.random()*6.283,alpha:rand(.5,1)}));
  MOTES=Array.from({length:44},()=>({x:Math.random()*W,y:Math.random()*H,
    r:rand(.6,2.4),vy:rand(-9,-2),vx:rand(-5,5),a:rand(.15,.65),
    ph:Math.random()*6.283,sp:rand(.4,1.3)}));
}
sizeWater();
function paintWater(now){
  const t=now*.001;
  wx.clearRect(0,0,W,H);
  wx.save(); wx.globalCompositeOperation='screen';
  for(const r of RAYS){
    const d=Math.sin(t*r.speed+r.phase);
    const tx=r.x+d*38, bx=tx+r.tilt*H+d*90;
    wx.globalAlpha=REDUCED?r.alpha*.4:r.alpha*(.62+.38*Math.sin(t*.5+r.phase));
    wx.fillStyle=rayGrad; wx.beginPath();
    wx.moveTo(tx-r.w/2,-20); wx.lineTo(tx+r.w/2,-20);
    wx.lineTo(bx+r.w*r.spread/2,H*.95); wx.lineTo(bx-r.w*r.spread/2,H*.95);
    wx.closePath(); wx.fill();
  }
  wx.restore();
  wx.save(); wx.globalCompositeOperation='screen';
  wx.strokeStyle='rgba(190,255,250,.16)'; wx.lineWidth=2;
  for(let i=0;i<7;i++){
    wx.globalAlpha=.5-i*.055; wx.beginPath();
    for(let x=0;x<=W;x+=14){
      const y=14+i*17+Math.sin(x*.021+t*1.15+i)*7+Math.sin(x*.009-t*.75+i*1.7)*11;
      x===0?wx.moveTo(x,y):wx.lineTo(x,y);
    }
    wx.stroke();
  }
  wx.restore();
  if(floorCv)wx.drawImage(floorCv,0,0,W,H);
  wx.save(); wx.globalCompositeOperation='screen';
  wx.strokeStyle='rgba(255,240,190,.13)'; wx.lineWidth=3;
  for(let i=0;i<5;i++){
    wx.globalAlpha=.42-i*.07; wx.beginPath();
    for(let x=0;x<=W;x+=16){
      const y=H*.905+i*11+Math.sin(x*.026+t*.9+i*1.4)*5+Math.sin(x*.012-t*.6)*7;
      x===0?wx.moveTo(x,y):wx.lineTo(x,y);
    }
    wx.stroke();
  }
  wx.restore();
  wx.save();
  for(const m of MOTES){
    m.y+=m.vy*.016; m.x+=m.vx*.016;
    if(m.y<-6){m.y=H+6;m.x=Math.random()*W;}
    if(m.x<-6)m.x=W+6; else if(m.x>W+6)m.x=-6;
    wx.globalAlpha=m.a*(.45+.55*Math.sin(t*m.sp+m.ph));
    wx.fillStyle='#dffaff'; wx.beginPath(); wx.arc(m.x,m.y,m.r,0,6.2832); wx.fill();
  }
  wx.restore();
}

/* ═══════════ KELP ═══════════ */
function bladePath(h,baseW,bend,ripple){
  const N=18,L=[],R=[];
  for(let i=0;i<=N;i++){
    const t=i/N, y=h*(1-t);
    const cx=Math.sin(t*1.9)*bend+t*t*bend*.55;
    const w=baseW*Math.pow(1-t,.52)*(1+Math.sin(t*9.5)*.07*ripple);
    L.push([cx-w/2,y]); R.push([cx+w/2,y]);
  }
  let d='M'+L[0][0].toFixed(1)+' '+L[0][1].toFixed(1);
  for(let i=1;i<L.length;i++)d+='L'+L[i][0].toFixed(1)+' '+L[i][1].toFixed(1);
  for(let i=R.length-1;i>=0;i--)d+='L'+R[i][0].toFixed(1)+' '+R[i][1].toFixed(1);
  return d+'Z';
}
function kelpSVG(h,w,hue,blades){
  const pad=w*2.6, vbW=pad*2, id='kg'+Math.random().toString(36).slice(2,7);
  let out='';
  for(let b=0;b<blades;b++){
    const bh=h*(.6+Math.random()*.4), bw=w*(.5+Math.random()*.6);
    const bend=((Math.random()-.5)*1.1+(b-(blades-1)/2)*.45)*w*5.2;
    const ox=pad+(b-(blades-1)/2)*w*.72+(Math.random()-.5)*w*.5;
    const li=13+Math.random()*9;
    out+='<g transform="translate('+ox.toFixed(1)+','+(h-bh).toFixed(1)+')">'
      +'<path d="'+bladePath(bh,bw,bend,1)+'" fill="url(#'+id+')" opacity="'+(.72+Math.random()*.28).toFixed(2)+'"/>'
      +'<path d="'+bladePath(bh,bw*.3,bend,0)+'" fill="hsl('+(hue+8)+' 55% '+(li+9)+'%)" opacity=".45"/></g>';
  }
  return '<svg width="'+vbW+'" height="'+h+'" viewBox="0 0 '+vbW+' '+h+'" xmlns="http://www.w3.org/2000/svg">'
    +'<defs><linearGradient id="'+id+'" x1="0" y1="1" x2="0" y2="0">'
    +'<stop offset="0%" stop-color="hsl('+(hue-6)+' 48% 10%)"/>'
    +'<stop offset="55%" stop-color="hsl('+hue+' 44% 17%)"/>'
    +'<stop offset="100%" stop-color="hsl('+(hue+12)+' 46% 25%)"/>'
    +'</linearGradient></defs>'+out+'</svg>';
}

const MILESTONES=new Set([10,25,50,100,200,350,500]);
let popScore=0, liveBubbles=0;
const BUBBLES=new Set();
const countEl=$('hud-count');

function bumpPop(){
  popScore++; countEl.textContent=popScore;
  countEl.classList.remove('bump'); void countEl.offsetWidth; countEl.classList.add('bump');
  if(MILESTONES.has(popScore))milestone(popScore);
}

function makeBubble(cx,cy,opt){
  opt=opt||{};
  const kind=opt.kind||'plain';
  if(kind==='plain'&&liveBubbles>=MAX_BUBBLES)return null;
  const size=opt.size||rand(50,132), tint=opt.tint||pick(TINTS);
  const el=document.createElement('div');
  el.className='bubble'+(kind==='pearl'?' pearl':'')+(kind==='mystery'?' mystery':'');
  el.style.width=size+'px'; el.style.height=size+'px';
  if(kind==='mystery'){
    el.style.background='radial-gradient(circle at 32% 26%,rgba(255,215,255,.34),rgba(190,40,255,.5))';
    el.style.border='2.5px solid #ff7ae6';
  }else{
    el.style.background='radial-gradient(circle at 32% 26%,'+tint.a+','+tint.b+')';
    el.style.border=(kind==='pearl'?'3px':'2px')+' solid '+tint.rim;
  }
  el.style.boxShadow='0 0 '+size*.34+'px '+tint.rim+'55,0 0 '+size*.62+'px '+tint.rim+'1f';
  const film=document.createElement('div'); film.className='film';
  film.style.setProperty('--spin',rand(0,360)+'deg'); el.appendChild(film);
  ['rim','shineA','shineB'].forEach(c=>{const d=document.createElement('div');d.className=c;el.appendChild(d);});
  if(kind==='mystery'){
    const q=document.createElement('div'); q.className='qmark'; q.textContent='?';
    q.style.fontSize=Math.round(size*.44)+'px'; el.appendChild(q);
  }else if(kind==='pearl'){
    const s=document.createElement('div'); s.className='face'; s.textContent='⭐';
    s.style.fontSize=Math.round(size*.34)+'px';
    s.style.filter='drop-shadow(0 0 12px rgba(255,225,120,.95))'; el.appendChild(s);
  }else if(Math.random()<.3){
    const f=document.createElement('div'); f.className='face';
    f.innerHTML=ART.icon(pick(COLOR_ICONS),'#ffffff',{flat:true});
    f.style.width=f.style.height=Math.round(size*.5)+'px';
    f.style.opacity='.8'; el.appendChild(f);
  }
  const ent={
    el,kind,size,tint,x:cx,y:cy,
    rise:opt.rise||rand(34,62),freq:rand(.5,1.5),amp:rand(16,44),spin:rand(-26,26),
    born:performance.now(),life:opt.life||rand(11,19),filmEl:film,
    dead:false,popped:false,
    update(dt,now){
      if(this.popped)return;
      const age=(now-this.born)/1000;
      this.y-=this.rise*dt;
      const dx=this.x+Math.sin(age*this.freq*6.283)*this.amp;
      const tf='translate3d('+(dx-this.size/2).toFixed(1)+'px,'+(this.y-this.size/2).toFixed(1)+'px,0)';
      this.el.style.setProperty('--tf',tf);
      let sc=1;
      if(age<.34){
        const k=age/.34,c1=1.70158,c3=c1+1;
        sc=1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2);
        this.el.style.opacity=String(Math.min(1,age/.12));
      }
      this.el.style.transform=sc===1?tf:tf+' scale('+sc.toFixed(3)+')';
      this.hitX=dx;
      if(!REDUCED)this.filmEl.style.setProperty('--spin',(age*this.spin)+'deg');
      const p=age/this.life;
      if(p>.76)this.el.style.opacity=String(Math.max(0,1-(p-.76)/.24));
      if(p>=1||this.y<-this.size*1.4)this.remove();
    },
    remove(){
      if(this.dead)return;
      BUBBLES.delete(this);
      if(this.kind==='plain')liveBubbles=Math.max(0,liveBubbles-1);
      kill(this);
    },
    pop(){
      if(this.popped||this.dead)return;
      this.popped=true; BUBBLES.delete(this);
      if(this.kind==='plain')liveBubbles=Math.max(0,liveBubbles-1);
      const x=this.hitX!==undefined?this.hitX:this.x, y=this.y;
      this.el.classList.add('popping');
      setTimeout(()=>kill(this),210);
      sPop(x,this.size);
      echo(this.kind==='mystery'?'#ff6ae0':this.tint.rim);
      bumpPop();
      if(this.kind==='mystery'){
        burst(x,y,20,TREASURE,{spread:230,size:'clamp(30px,8.5vw,54px)'});
        arp([392,523,659,784,1047,1319],.075,.2);
        for(let i=0;i<8;i++)setTimeout(()=>makeBubble(x+rand(-140,140),y+rand(-140,140)),i*70);
      }else if(this.kind==='pearl'){
        burst(x,y,22,EMOJIS,{spread:250,size:'clamp(30px,9vw,56px)'});
        chord([262,330,392,523,659],1.2,.15);
      }else{
        burst(x,y,12,EMOJIS,{spread:170});
        chainFrom(x,y); combo(x,y);
      }
    }
  };
  const tf='translate3d('+(cx-size/2)+'px,'+(cy-size/2)+'px,0)';
  el.style.setProperty('--tf',tf); el.style.transform=tf; el.style.opacity='0';
  el._ent=ent;
  el.addEventListener('touchstart',e=>{e.stopPropagation();ent.pop();},{passive:false});
  el.addEventListener('mousedown',e=>{e.stopPropagation();ent.pop();});
  stage.appendChild(el); add(ent); BUBBLES.add(ent);
  if(kind==='plain'){liveBubbles++; sBlub();}
  return ent;
}

function chainFrom(x,y){
  BUBBLES.forEach(b=>{
    if(b.popped||b.kind!=='plain')return;
    const bx=b.hitX!==undefined?b.hitX:b.x;
    const d=Math.hypot(bx-x,b.y-y);
    if(d>0&&d<118)setTimeout(()=>b.pop(),140+d*.85);
  });
}

function burst(cx,cy,n,set,opt){
  opt=opt||{};
  const spread=opt.spread||170;
  // On the quiz/count screens the reward fires right under the orb the child just
  // tapped, and #stage sits below those screens — it would be hidden. Use #fx there.
  const host=SCREEN==='play'?stage:fxLayer;
  for(let i=0;i<n;i++){
    const a=(i/n)*6.283+rand(-.4,.4), d=spread*rand(.45,1);
    const el=document.createElement('div'); el.className='pcl'; el.textContent=pick(set);
    el.style.fontSize=opt.size||'clamp(22px,6.4vw,44px)';
    const r=rand(-620,620);
    el.style.setProperty('--x0',cx+'px'); el.style.setProperty('--y0',cy+'px');
    el.style.setProperty('--x1',(cx+Math.cos(a)*d)+'px');
    el.style.setProperty('--y1',(cy+Math.sin(a)*d)+'px');
    el.style.setProperty('--r1',r*.4+'deg'); el.style.setProperty('--r2',r*.7+'deg');
    el.style.setProperty('--r3',r+'deg');
    const dur=rand(1.15,1.8);
    el.style.animation='pclOut '+dur+'s cubic-bezier(.15,.85,.35,1) forwards';
    host.appendChild(el);
    setTimeout(()=>el.parentNode&&el.parentNode.removeChild(el),dur*1000+80);
  }
}

function sayWord(x,y){
  const word=pick(WORDS), isRui=word==='Rui';
  const col=isRui?'#ffd54a':pick(WORD_TINTS);
  const tilt=rand(-1,1)*(isRui?7:17);
  const el=document.createElement('div'); el.className='word'; el.textContent=word;
  el.style.color=col;
  el.style.fontSize=isRui?'clamp(46px,14vw,84px)':'clamp(31px,9.2vw,60px)';
  el.style.setProperty('--tilt',tilt+'deg');
  el.style.setProperty('--tf','translate3d('+x+'px,'+y+'px,0) translate(-50%,-50%)');
  el.style.textShadow=isRui
    ?'0 0 26px #ffd54a,0 0 60px rgba(255,160,0,.65),0 0 110px rgba(255,110,0,.3),0 3px 0 rgba(0,20,30,.5)'
    :'0 0 16px '+col+',0 0 38px '+col+'99,0 0 72px '+col+'3a,0 2px 0 rgba(0,20,30,.45)';
  el.style.animation='wordIn .36s cubic-bezier(.34,1.56,.64,1) forwards';
  if(isRui){const c=document.createElement('span');c.className='crown';c.textContent='👑';el.appendChild(c);}
  stage.appendChild(el); sWord();
  const n=isRui?6:2, sp=isRui?130:82;
  for(let i=0;i<n;i++)makeBubble(x+rand(-sp,sp),y+rand(-sp,sp));
  const hold=isRui?1700:1050, fade=isRui?.7:.5;
  setTimeout(()=>{
    if(!el.parentNode)return;
    el.style.animation='wordOut '+fade+'s ease-out forwards';
    setTimeout(()=>el.parentNode&&el.parentNode.removeChild(el),fade*1000+70);
  },hold);
}

let comboN=0,comboT=null;
const COMBO_WORDS=['NICE!','SUPER!','AMAZING!','WOW WOW WOW!'];
function combo(x,y){
  comboN++; clearTimeout(comboT);
  comboT=setTimeout(()=>comboN=0,1100);
  if(comboN>=4&&comboN%4===0){
    const i=Math.min((comboN/4|0)-1,COMBO_WORDS.length-1);
    const col=WORD_TINTS[i%WORD_TINTS.length];
    const el=document.createElement('div'); el.className='combo';
    el.textContent=COMBO_WORDS[i]; el.style.color=col;
    el.style.fontSize='clamp(44px,13vw,84px)';
    el.style.setProperty('--tf','translate3d('+x+'px,'+(y-56)+'px,0) translate(-50%,-50%)');
    el.style.textShadow='0 0 20px '+col+',0 0 52px '+col+'99,0 3px 0 rgba(0,20,30,.5)';
    el.style.animation='comboOut 1.35s cubic-bezier(.34,1.3,.64,1) forwards';
    document.body.appendChild(el);
    burst(x,y,10,EMOJIS,{spread:190});
    setTimeout(()=>el.parentNode&&el.parentNode.removeChild(el),1420);
  }
}

      +'background:'+cols[i%cols.length]+';border-radius:'+(Math.random()>.5?'50%':'3px')+';'
      +'--cy0:'+(-rand(20,70))+'px;--cy1:'+(H*.9+rand(0,180))+'px;'

function milestone(s){
  const rgb=MS_RGB[s]||'255,255,255', f=$('flash');
  f.style.background='radial-gradient(ellipse at center,rgba('+rgb+',.55) 0%,rgba('+rgb+',.16) 42%,transparent 72%)';
  f.style.animation='none'; void f.offsetWidth;
  f.style.animation='flashOut 1.05s ease-out forwards';
  for(let i=0;i<14;i++){
    const r=document.createElement('div'); r.className='ray';
    r.style.width=rand(230,470)+'px'; r.style.height=rand(3,7)+'px';
    r.style.background='linear-gradient(90deg,rgba('+rgb+',.8),transparent)';
    r.style.setProperty('--ra',(i/14*360)+'deg');
    r.style.animation='rayOut .9s ease-out '+(i*.035)+'s forwards';
    document.body.appendChild(r);
    setTimeout(()=>r.parentNode&&r.parentNode.removeChild(r),1100);
  }
  const l=document.createElement('div'); l.className='ms-label';
  l.innerHTML='<div style="font-size:.78em">'+(MS_ICON[s]||'⭐')+'</div>'+s+'!';
  l.style.textShadow='0 0 38px rgba('+rgb+',1),0 0 82px rgba('+rgb+',.55),0 4px 14px rgba(0,15,30,.7)';
  l.style.animation='msPop 1.6s cubic-bezier(.34,1.3,.64,1) forwards';
  document.body.appendChild(l);
  setTimeout(()=>l.parentNode&&l.parentNode.removeChild(l),1700);
  arp([523,659,784,1047,1319],.1,.2);
  confettiRain(38);
}

  el.style.cssText='color:'+col+';font-size:clamp(33px,9.6vw,64px);z-index:500;'
    +'--tilt:'+rand(-8,8)+'deg;--tf:translate3d('+x+'px,'+y+'px,0) translate(-50%,-50%);'
    +'text-shadow:0 0 18px '+col+',0 0 42px '+col+'99,0 2px 0 rgba(0,20,30,.5);'
    +'animation:wordIn .36s cubic-bezier(.34,1.56,.64,1) forwards;';
  document.body.appendChild(el); sWord();
  setTimeout(()=>{
    if(!el.parentNode)return;
    el.style.animation='wordOut .62s ease-out forwards';
    setTimeout(()=>el.parentNode&&el.parentNode.removeChild(el),680);
  },1150);
}
function mCreature(){
  const c=pick(CREATURES), edge=pick(['bottom','left','right']);
  const el=document.createElement('div'); el.className='creature';
  el.innerHTML=ART.icon(c.icon,c.c);
  el.style.width=el.style.height='clamp(84px,23vw,138px)';
  const dur=3.6;
  if(edge==='bottom'){el.style.left=rand(16,Math.max(20,W-150))+'px';el.style.bottom='0';
    el.style.animation='peekUp '+dur+'s cubic-bezier(.34,1.2,.64,1) forwards';}
  else if(edge==='left'){el.style.left='0';el.style.top=rand(90,Math.max(100,H-250))+'px';
    el.style.animation='peekL '+dur+'s cubic-bezier(.34,1.2,.64,1) forwards';}
  else{el.style.right='0';el.style.top=rand(90,Math.max(100,H-250))+'px';
    el.style.animation='peekR '+dur+'s cubic-bezier(.34,1.2,.64,1) forwards';}
  const tap=e=>{
    e.stopPropagation();
    const r=el.getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height/2;
    burst(x,y,13,EMOJIS,{spread:180,size:'clamp(30px,8vw,52px)'});
    shout(x,y-58,c.call);
    el.style.transition='transform .18s cubic-bezier(.34,1.56,.64,1)';
    const cur=el.style.transform||'';
    el.style.transform=cur+' scale(1.4)';
    setTimeout(()=>el.style.transform=cur,200);
  };
  el.addEventListener('touchstart',tap,{passive:false});
  el.addEventListener('mousedown',tap);
  document.body.appendChild(el);
  setTimeout(()=>el.parentNode&&el.parentNode.removeChild(el),dur*1000+120);
  return dur*1000;
}
function mShoal(){
  const n=rand(11,18)|0, dir=Math.random()>.5?1:-1;
  const baseY=rand(H*.2,H*.72), speed=rand(105,165);
  for(let i=0;i<n;i++){
    const el=document.createElement('div'); el.className='swimmer';
    el.innerHTML=ART.icon('fish',pick(FISH_COLORS));
    el.style.width=el.style.height=rand(30,54)+'px'; el.style.zIndex='7';
    el.style.filter='drop-shadow(0 4px 10px rgba(0,30,50,.4))';
    document.body.appendChild(el);
    const oy=rand(-70,70), ox=rand(-260,60)*dir;
    const ent=add({el,dead:false,t:0,x:dir>0?-80+ox:W+80+ox,
      update(dt){
        this.t+=dt; this.x+=dir*speed*dt;
        const y=baseY+oy+Math.sin(this.t*2.1+i)*13;
        el.style.transform='translate3d('+this.x+'px,'+y+'px,0) scaleX('+(dir>0?-1:1)+')';
        if(dir>0?this.x>W+140:this.x<-140)kill(this);
      }});
    const tap=e=>{
      e.stopPropagation();
      const r=el.getBoundingClientRect();
      burst(r.left+r.width/2,r.top+r.height/2,7,['💧','✨','🫧'],{spread:120});
      sBlub(); kill(ent);
    };
    el.addEventListener('touchstart',tap,{passive:false});
    el.addEventListener('mousedown',tap);
  }
  return (W+320)/speed*1000;
}

    update(dt){
      this.t+=dt; this.x+=dir*speed*dt;

  el.addEventListener('touchstart',tap,{passive:false});

}
function weedSVG(w,h,hue){
  let p='';

    p+='<path d="M'+ox+' '+h+' C '+(ox-14)+' '+h*.6+', '+(ox+16)+' '+h*.42+', '+(ox-4)+' '+h*.06+'" '
      +'stroke="hsl('+(hue+i*6)+' 58% '+(30+i*4)+'%)" stroke-width="'+(7-i)+'" fill="none" stroke-linecap="round"/>';
  }
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+p+'</svg>';

  el.innerHTML=weedSVG(w,h,hue); el.style.opacity='.7';
  document.body.appendChild(el);
  const ent=add({el,dead:false,t:0,x:dir>0?-w-40:W+40,

      this.t+=dt; this.x+=dir*speed*dt;

        +'background:hsla('+hue+',60%,45%,.6);--bx:'+Math.cos(a)*rand(60,120)+'px;'
        +'--by:'+Math.sin(a)*rand(60,120)+'px;animation:weedBurst .6s ease-out forwards;';
      document.body.appendChild(b);
      setTimeout(()=>b.parentNode&&b.parentNode.removeChild(b),660);
    }
    for(let i=0;i<5;i++)makeBubble(cx+rand(-50,50),cy+rand(-40,40),{size:rand(28,58)});
    sBlub(); kill(ent);
  };
  el.addEventListener('touchstart',tap,{passive:false});
  el.addEventListener('mousedown',tap);
  return (W+w*2+120)/speed*1000;
}

const lastRun={}; let busyUntil=0,lastId=null;
function director(){
  if(document.hidden){setTimeout(director,5000);return;}
  const now=performance.now();
  if(now<busyUntil){setTimeout(director,1200);return;}
  // outside free play only the ambient (non-interactive-critical) moments run
  const allowed=MOMENTS.filter(m=>SCREEN==='play'?true:m.amb);
  const pool=allowed.filter(m=>m.id!==lastId&&(now-(lastRun[m.id]||-Infinity))>=m.cool);
  const usable=pool.length?pool:allowed.filter(m=>m.id!==lastId);
  if(!usable.length){setTimeout(director,4000);return;}
  let r=Math.random()*usable.reduce((s,m)=>s+m.w,0), chosen=usable[0];
  for(const m of usable){r-=m.w;if(r<=0){chosen=m;break;}}
  const dur=chosen.run()||2000;
  lastRun[chosen.id]=now; lastId=chosen.id;
  busyUntil=now+Math.min(dur,9000);
  setTimeout(director,rand(11000,16500));
}

function bubbleUnder(t){

  let n=t;

const swipes=new Map();
const HOLD_MIN=22,HOLD_MAX=178,HOLD_RATE=88;
function startHold(id,x,y){
  const tint=pick(TINTS);
  const el=document.createElement('div'); el.className='bubble';
  el.style.pointerEvents='none';
  el.style.border='2px solid '+tint.rim;
  el.style.background='radial-gradient(circle at 32% 26%,'+tint.a+','+tint.b+')';
  ['film','rim','shineA'].forEach(c=>{const d=document.createElement('div');d.className=c;el.appendChild(d);});
  stage.appendChild(el);
  const h={el,x,y,size:HOLD_MIN,tint,t0:performance.now()};
  const step=now=>{
    if(!holds.has(id))return;
    h.size=Math.min(HOLD_MIN+((now-h.t0)/1000)*HOLD_RATE,HOLD_MAX);
    el.style.width=h.size+'px'; el.style.height=h.size+'px';
    el.style.transform='translate3d('+(x-h.size/2)+'px,'+(y-h.size/2)+'px,0)';
    el.style.boxShadow='0 0 '+h.size*.4+'px '+tint.rim+'88,0 0 '+h.size*.7+'px '+tint.rim+'22';
    el.style.opacity=String(.45+(h.size/HOLD_MAX)*.55);
    h.raf=requestAnimationFrame(step);
  };
  h.raf=requestAnimationFrame(step);
  holds.set(id,h);
  startLoop();
}
function clearHolds(){ [...holds.keys()].forEach(cancelHold); }
function cancelHold(id){
  const h=holds.get(id); if(!h)return;
  holds.delete(id); cancelAnimationFrame(h.raf);
  h.el.parentNode&&h.el.parentNode.removeChild(h.el);
}
function endHold(id){
  const h=holds.get(id); if(!h)return;
  holds.delete(id); cancelAnimationFrame(h.raf);
  h.el.parentNode&&h.el.parentNode.removeChild(h.el);
  if(h.size<HOLD_MIN+12)makeBubble(h.x,h.y);

function newColorRound(){
  const pool=G.lastColor?COLORS.filter(c=>c.id!==G.lastColor):COLORS;
  const target=pick(pool); G.lastColor=target.id;
  const cols=[target,...shuffle(COLORS.filter(c=>c.id!==target.id)).slice(0,G.colorN-1)];
  const icons=shuffle(COLOR_ICONS).slice(0,cols.length);
  const all=shuffle(cols.map((c,i)=>({color:c.id,icon:icons[i]})));
  return {kind:'color',target,items:all,correct:all.findIndex(o=>o.color===target.id)};
}
function newShapeRound(){
  const pool=G.lastShape?SHAPES.filter(s=>s.id!==G.lastShape):SHAPES;
  const target=pick(pool); G.lastShape=target.id;
  const wrongs=shuffle(SHAPES.filter(s=>s.id!==target.id)).slice(0,G.shapeN-1);
  const all=shuffle([target,...wrongs]);
  const cols=shuffle(SHAPE_FILLS);
  const items=all.map((s,i)=>({...s,fill:cols[i%cols.length]}));
  return {kind:'shape',target,items,correct:items.findIndex(c=>c.id===target.id)};

    b.style.width=size+'px'; b.style.height=size+'px';
    b.style.background='radial-gradient(circle at 32% 26%,'+t.a+','+t.b+')';
    b.style.border='2px solid '+t.rim;
    b.style.boxShadow='0 0 '+size*.32+'px '+t.rim+'55,inset 0 -6px 14px rgba(255,255,255,.28)';
    const em=document.createElement('div'); em.className='sh';
    em.innerHTML=ART.icon(r.obj.icon,r.obj.c);
    b.appendChild(em);
    const g=document.createElement('div'); g.className='gloss'; b.appendChild(g);
    onTap(b,()=>countTap(i,b,t));
    grid.appendChild(b); nodes.push(b);
  }
  stagger(nodes);
}
function countTap(i,el,tint){
  if(G.locked)return;
  const r=G.cur;
  if(r.done.has(i))return;
  r.done.add(i); r.got++;
  const bb=el.getBoundingClientRect();
  el.classList.add('gone');
  sPop(bb.left+bb.width/2,bb.width);
  burst(bb.left+bb.width/2,bb.top+bb.height/2,9,EMOJIS,{spread:130});
  echo(tint.rim);
  const now=$('c-now'); now.textContent=r.got;
  now.classList.remove('pop'); void now.offsetWidth; now.classList.add('pop');
  sTick();
  if(r.got===r.n){
    now.classList.add('done');
    G.locked=true; G.score++;
    tallyBump('c-score',G.score);
    G.preT=setTimeout(celebrate,480);
  }
}

/* ═══════════ CELEBRATION ═══════════ */
function clearGameTimers(){
  clearTimeout(G.preT); clearTimeout(G.celT); clearTimeout(G.nextT); clearTimeout(G.toastT);
  G.preT=G.celT=G.nextT=G.toastT=null;
}
function celebrate(){
  const r=G.cur, cel=$('cel');
  if(!r)return;
  const gen=G.gen;
  let obj,extra,hex;
  if(r.kind==='color'){
    // The reward is where the shape finally appears in the colour it was named for.
    obj=ART.icon(r.items[r.correct].icon,r.target.hex);
    extra="That's "+r.target.label+"!"; hex=r.target.hex;
  }else if(r.kind==='shape'){
    obj=shapeSVG(r.target.id,'#ffd54a');
    extra="That's "+r.target.art+' '+r.target.label+'!'; hex='#ffd54a';
  }else{
    obj=ART.icon(r.obj.icon,r.obj.c); extra='You counted '+r.n+'!'; hex=r.obj.c;
  }
  $('cel-obj').innerHTML=obj;
  $('cel-praise').textContent=pick(PRAISE);
  const ex=$('cel-extra'); ex.textContent=extra; ex.style.color=hex;
  ex.style.textShadow='0 0 22px '+hex+'aa';
  ['cel-obj','cel-praise','cel-extra','cel-hint'].forEach(id=>{
    const e=$(id); e.style.animation='none'; void e.offsetWidth; e.style.animation='';
  });
  cel.style.background='radial-gradient(ellipse at 50% 40%,'+hex+'40 0%,rgba(2,10,28,.93) 60%)';
  cel.classList.add('on');
  confettiRain(34);
  sLevel();
  let done=false;
  const dismiss=()=>{ if(done)return; done=true; cel.removeEventListener('pointerdown',dismiss);
    if(gen===G.gen)closeCel(gen); };
  G.celT=setTimeout(dismiss,2700);
  cel.addEventListener('pointerdown',dismiss,{once:true});
}
function closeCel(gen){
  $('cel').classList.remove('on');
  const lv=G.leveled&&G.mode!=='count'; G.leveled=false;
  G.nextT=setTimeout(()=>{
    if(gen!==G.gen)return;
    G.round++; G.locked=false;
    const go=()=>{
      if(gen!==G.gen)return;
      if(G.mode==='color'){G.cur=newColorRound();renderQuiz();}
      else if(G.mode==='shape'){G.cur=newShapeRound();renderQuiz();}
      else{G.cur=newCountRound();renderCount();}
    };
    if(lv)showToast(go,gen); else go();
  },260);
}
function showToast(cb,gen){
  const t=$('toast');
  const n=G.mode==='color'?G.colorN:G.shapeN;
  $('toast-sub').textContent=['','','Two choices','Three choices','Four choices','Five choices — top level!'][n]||'Getting harder';
  t.classList.remove('on'); void t.offsetWidth; t.classList.add('on');
  sLevel();
  G.toastT=setTimeout(()=>{t.classList.remove('on'); cb();},1750);
}

/* ═══════════ ROUTER ═══════════ */
function show(id){
  if(SCREEN==='play'&&id!=='play'){ stopIdle(); clearHolds(); }
  G.gen++; clearGameTimers();
  $('cel').classList.remove('on');
  $('toast').classList.remove('on');
  SCREEN=id;
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('off',s.id!==id));
}
function goHome(){
  G.locked=false;
  G.mode=null; G.cur=null;
  show('hub');
}
function startQuiz(mode){
  G.mode=mode; G.score=0; G.round=1; G.locked=false; G.streak=0; G.leveled=false;
  if(mode==='color'){G.lastColor=null; G.colorN=G.colorStart; G.cur=newColorRound();}
  else{G.lastShape=null; G.shapeN=G.shapeStart; G.cur=newShapeRound();}
  $('q-score').textContent='0';
  renderQuiz(); show('quiz');
}
function startCount(){
  G.mode='count'; G.score=0; G.round=1; G.locked=false; G.streak=0; G.leveled=false;
  G.cur=newCountRound();
  $('c-score').textContent='0';
  renderCount(); show('count');
}
function startPlay(){ show('play'); wakeIdle(); }

/* ═══════════ PILLS ═══════════ */
function buildPills(hostId,vals,get,set){
  const host=$(hostId);
  vals.forEach(v=>{
    const val=typeof v==='object'?v.val:v;
    const lab=typeof v==='object'?v.label:v;
    const b=document.createElement('span');
    b.className='pill'+(val===get()?' on':'');
    b.textContent=lab;
    onTap(b,()=>{
      host.querySelectorAll('.pill').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); set(val);
    });
    host.appendChild(b);
  });
}

/* ═══════════ INIT ═══════════ */
buildPills('p-color',[2,3,4,5],()=>G.colorStart,v=>{G.colorStart=v;G.colorN=v;});
buildPills('p-shape',[2,3,4,5],()=>G.shapeStart,v=>{G.shapeStart=v;G.shapeN=v;});
buildPills('p-count',[{label:'1–5',val:5},{label:'1–10',val:10}],()=>G.countMax,v=>G.countMax=v);

['m-hub','m-quiz','m-count','m-play'].forEach(id=>{
  const b=$(id); if(!b)return;
  b.classList.toggle('off',MUTED);
  onTap(b,()=>{ ac(); setMuted(!MUTED); if(!MUTED)startPad(); });
});

onTap($('t-play'), startPlay);
onTap($('t-color'),()=>startQuiz('color'));
onTap($('t-shape'),()=>startQuiz('shape'));
onTap($('t-count'),startCount);
onTap($('q-back'),goHome);
onTap($('c-back'),goHome);
onTap($('p-back'),goHome);

})();
</script>
